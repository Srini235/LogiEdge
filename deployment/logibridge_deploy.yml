---
- name: LogiEdge OTA Deployment Playbook
  hosts: localhost
  connection: local
  vars:
    target_dir: "/opt/logibridge"
    model_src: "../inference/anomaly_model.tflite"
    ref_src: "../monitoring/reference_dist.json"

  tasks:
    - name: 1. Create /opt/logibridge directory if not present
      file:
        path: "{{ target_dir }}"
        state: directory
        mode: '0755'

    - name: 2. Copy new model file to /opt/logibridge/model.tflite
      copy:
        src: "{{ model_src }}"
        dest: "{{ target_dir }}/model.tflite"
        mode: '0644'

    - name: 3. Copy updated reference_dist.json
      copy:
        src: "{{ ref_src }}"
        dest: "{{ target_dir }}/reference_dist.json"
        mode: '0644'

    - name: 4. Stop the running inference container if running
      community.docker.docker_container:
        name: logiedge-inference-node
        state: stopped
      ignore_errors: yes

    - name: 5. Pull updated container image from local Docker registry
      community.docker.docker_image:
        name: logiedge-inference:latest
        source: local

    - name: 6. Start inference container with environment variables
      community.docker.docker_container:
        name: logiedge-inference-node
        image: logiedge-inference:latest
        state: started
        restart_policy: always
        env:
          MODEL_PATH: "/app/model.tflite"
          MQTT_BROKER: "host.docker.internal"
        volumes:
          - "{{ target_dir }}/model.tflite:/app/model.tflite:ro"
          - "{{ target_dir }}/reference_dist.json:/app/reference_dist.json:ro"

    - name: 7. Wait 15 seconds and verify container is running
      pause:
        seconds: 15